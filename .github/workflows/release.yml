name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$sdk/cmdline-tools/latest"
          # The runner image also exports ANDROID_SDK_ROOT. AGP fails the build
          # when that path disagrees with ANDROID_HOME.
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"

      - name: Test and build release APK
        run: |
          set +e
          set -o pipefail
          chmod +x ./gradlew
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is empty"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            ls -d "$ANDROID_HOME/platforms/"* || true
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          } 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            tail -n 80 gradle.log | while IFS= read -r line; do
              line=${line//$'\r'/}
              echo "::error::${line}"
            done
            exit "$status"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          sha256sum "$apk" > app-release.apk.sha256
          gh release create "${GITHUB_REF_NAME}" \
            "$apk" \
            app-release.apk.sha256 \
            --title "iScroll ${GITHUB_REF_NAME}" \
            --notes "$(cat <<EOF
          Sideload build of iScroll ${GITHUB_REF_NAME}.

          Install app-release.apk, then turn on the iScroll accessibility service. iScroll keeps a daily report of time on Instagram, YouTube, and Reddit, and counts reels, Shorts, and Reddit posts scrolled past.

          Pause from the app, the notification, or the Quick Settings tile. Force stop also ends tracking until you open iScroll again.
          EOF
          )"
